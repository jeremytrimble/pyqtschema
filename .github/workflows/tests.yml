name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev libqt6gui6t64 libgl1 libegl1 libxkbcommon-x11-0
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    
    - name: Run tests
      run: uv run --python ${{ matrix.python-version }} pytest tests/
